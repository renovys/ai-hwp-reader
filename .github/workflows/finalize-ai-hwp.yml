name: finalize ai hwp reader

on:
  push:
    branches: ["improve/ai-hwp-reader-v0.3.0"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: improve/ai-hwp-reader-v0.3.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 생성물 재생성
        run: python tools/build_single.py
      - name: 설치 및 전체 회귀시험
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests -q
      - name: SKILL 단일파일 실행 확인
        run: |
          python skill/hwp_reader_single.py --help >/dev/null 2>&1 || test $? -eq 1
      - name: 생성물 커밋
        shell: bash
        run: |
          git add SKILL.md skill/hwp_reader_single.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "AI HWP Reader SKILL 및 단일 파일 재생성"
          git push origin HEAD:improve/ai-hwp-reader-v0.3.0
