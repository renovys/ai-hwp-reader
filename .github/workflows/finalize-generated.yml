name: finalize generated artifacts

on:
  push:
    branches: ["improve/real-hwp-hardening-v0.2.0"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/real-hwp-hardening-v0.2.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 생성물 재생성
        run: python tools/build_single.py
      - name: 회귀시험
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests -q
      - name: 생성물 커밋
        shell: bash
        run: |
          git add SKILL.md skill/hwp_reader_single.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SKILL 및 단일 파일 배포본 재생성"
          git push origin HEAD:improve/real-hwp-hardening-v0.2.0
