name: release-asset

# 릴리스가 게시되면 SKILL.md와 업로드용 스킬 패키지(zip)를 그 릴리스의 자산으로 올린다.
# 자산 링크(releases/latest/download/SKILL.md)만 Content-Disposition: attachment로 내려가
# 클릭 즉시 저장된다. 저장소 안의 raw 링크는 브라우저에서 그냥 열린다.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "자산을 붙일 릴리스 태그 (예: v0.5.0)"
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 생성물 재생성 (커밋본과 어긋나면 실패)
        run: |
          python tools/build_single.py
          git diff --exit-code -- SKILL.md skill/hwp_reader_single.py
      - name: 스킬 패키지 빌드
        run: python tools/build_skill_package.py
      - name: 만든 버전이 태그와 같은지 확인
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import os, re, zipfile
          tag = os.environ["TAG"].lstrip("v")
          with zipfile.ZipFile("dist/ai-hwp-reader-skill.zip") as z:
              doc = z.read("ai-hwp-reader/SKILL.md").decode("utf-8")
          assert re.search(rf"v{re.escape(tag)}\b", doc), f"{tag} 자산이 아니다"
          print(f"자산 버전 확인: v{tag}")
          PY
      - name: 릴리스에 SKILL.md·스킬 패키지 첨부
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" SKILL.md dist/ai-hwp-reader-skill.zip --clobber
