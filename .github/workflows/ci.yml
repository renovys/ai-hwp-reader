name: tests

on:
  push:
    branches: [main, "improve/extreme-hardening-v0.4.0-r3"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: 생성물 재생성
        run: python tools/build_single.py
      - name: 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: MCP SDK (3.10 이상에서만 배포된다)
        if: matrix.python != '3.9'
        run: python -m pip install -e ".[mcp]"
      - name: 시험
        run: python -m pytest tests -q
      - name: 컴파일 확인
        run: python -m compileall -q hwp_reader skill/hwp_reader_single.py
      - name: 명령이 실제로 실행되는지
        run: |
          ai-hwp-reader --version
          ai-hwp-reader --help
