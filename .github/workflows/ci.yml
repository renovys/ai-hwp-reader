name: tests

on:
  push:
    branches: [main, "improve/extreme-hardening-v0.4.0-r3"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: 생성물 재생성
        run: python tools/build_single.py
      - name: 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: MCP SDK (3.10 이상에서만 배포된다)
        if: matrix.python != '3.9'
        run: python -m pip install -e ".[mcp]"
      - name: 시험
        run: python -m pytest tests -q
      - name: 컴파일 확인
        run: python -m compileall -q hwp_reader skill/hwp_reader_single.py
      - name: 명령이 실제로 실행되는지
        run: |
          ai-hwp-reader --version
          ai-hwp-reader --help

  finalize-generated:
    if: github.ref == 'refs/heads/improve/extreme-hardening-v0.4.0-r3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 생성물 확정 및 임시 파일 정리
        run: |
          python tools/build_single.py
          rm -f payload-v04-test.txt payload-v04-part*.txt v04code-p*.txt v04hex-p*.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "확정할 변경 없음"
            exit 0
          fi
          git commit -m "0.4.0 생성물 동기화 및 임시 검증 파일 정리"
          git push
