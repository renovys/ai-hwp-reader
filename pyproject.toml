[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hwp-reader"
version = "0.3.0"
description = "ChatGPT·Claude·Gemini가 HWP·HWPX의 본문·병합 표·숨은 메모를 읽고 일하게 하는 AI용 한글 문서 리더."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Junseog Seo" }]
keywords = [
  "hwp", "hwpx", "hancom", "hangul", "korean", "hanword", "owpml",
  "hwp-parser", "hwp-reader", "ai-hwp-reader", "ai-hwp", "ai-document-reader",
  "mcp", "llm", "rag", "document", "chatgpt", "claude", "gemini",
  "한컴", "한컴오피스", "한글", "한글파일", "아래아한글", "아래한글", "한글과컴퓨터",
  "AI한글", "HWP파싱", "표추출",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Korean",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=7"]

[project.scripts]
hwp-reader = "hwp_reader.cli:main"
hwp-reader-mcp = "hwp_reader.mcp_server:main"

[project.urls]
Homepage = "https://github.com/renovys/hwp-reader"
Issues = "https://github.com/renovys/hwp-reader/issues"
Documentation = "https://github.com/renovys/hwp-reader/blob/main/docs/hwp-format.md"
Changelog = "https://github.com/renovys/hwp-reader/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["hwp_reader*"]
